name: Fork build

# Unsigned Windows build of any branch, published as a zip on a pre-release.
# Kept separate from ci.yml so upstream merges don't conflict. The workflow
# lives only on this branch, so builds are started by hand with the branch to
# build as input:
#   gh workflow run fork-build.yml --ref ci/fork-zip-build -f ref=feat/widget-registry
# The push trigger registers the workflow (GitHub only lists workflows outside
# the default branch after a push event) and builds this branch.
on:
  push:
    branches: [ci/fork-zip-build]
    paths: [.github/workflows/fork-build.yml]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        type: string

permissions:
  contents: write # create the release

concurrency:
  group: fork-build-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Personal test builds: never run if this file lands in another repo.
    if: github.repository == 'estem8/irdashies'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Build native addons
        run: npm run irsdk:build

      - run: npx electron-forge package

      # Forge packages without the addons when build/Release is empty, and the
      # app then can't load the iRacing SDK.
      - name: Verify packaged native addons
        shell: pwsh
        run: |
          $dir = 'out/irdashies-win32-x64/resources/app.asar.unpacked/.vite/build/Release'
          $built = @(Get-ChildItem build/Release -Filter '*.node')
          if ($built.Count -eq 0) { throw 'No native addons were built.' }
          foreach ($addon in $built) {
            if (-not (Test-Path -LiteralPath "$dir/$($addon.Name)")) {
              throw "Native addon missing from the package: $($addon.Name)"
            }
          }
          Get-ChildItem $dir -Filter '*.node' | Select-Object -ExpandProperty Name

      - name: Zip the package
        shell: pwsh
        run: |
          $short = git rev-parse --short HEAD
          Compress-Archive -Path out/irdashies-win32-x64/* `
            -DestinationPath "irdashies-win32-x64-$short.zip"

      # One pre-release per built commit, tagged build-<ref>-<sha>. Push runs
      # only check the workflow still builds; they'd publish a copy of main.
      - name: Publish pre-release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          tag="build-${REF//\//-}-$short"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "irdashies-win32-x64-$short.zip" \
            --target "$sha" --prerelease --latest=false \
            --title "$REF @ $short" \
            --notes "Unsigned test build of \`$REF\` at $sha."
